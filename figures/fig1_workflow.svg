<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <!-- Outer container card -->
  <rect x="15" y="15" width="870" height="390" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Title banner -->
  <text x="35" y="45" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    Figure 1: End-to-End Circulation Workflow &amp; State Machine Transition Architecture
  </text>
  <text x="35" y="65" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#64748b">
    Complete lifecycle spanning catalog discovery, transactional inventory locking, temporal monitoring, and fine assessment.
  </text>

  <!-- Step 1: Patron Discovery -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="145" height="110" rx="8" fill="url(#blueGrad)" stroke="#1e40af" stroke-width="1"/>
    <text x="112" y="130" font-family="DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Discovery</text>
    <text x="112" y="152" font-family="DejaVu Sans, Arial" font-size="10" fill="#e0e7ff" text-anchor="middle">Catalog Query</text>
    <text x="112" y="170" font-family="DejaVu Sans, Arial" font-size="9" fill="#c7d2fe" text-anchor="middle">Search / Filter</text>
    <rect x="55" y="182" width="115" height="18" rx="4" fill="#1e293b" opacity="0.4"/>
    <text x="112" y="195" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#ffffff" text-anchor="middle">GET /api/books</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 185 155 L 225 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: Inventory Evaluation (Decision Diamond) -->
  <g filter="url(#shadow)">
    <polygon points="305,100 375,155 305,210 235,155" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="305" y="148" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Available?</text>
    <text x="305" y="166" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#0284c7" text-anchor="middle">copies &gt; 0</text>
  </g>

  <!-- Out of Stock Branch -->
  <path d="M 305 210 L 305 270" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <rect x="235" y="275" width="140" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" filter="url(#shadow)"/>
  <text x="305" y="298" font-family="DejaVu Sans, Arial" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">Out of Stock</text>
  <text x="305" y="316" font-family="DejaVu Sans, Arial" font-size="9" fill="#7f1d1d" text-anchor="middle">Title Request Queue</text>
  <text x="305" y="334" font-family="DejaVu Sans Mono, monospace" font-size="8" fill="#b91c1c" text-anchor="middle">POST /api/requests</text>

  <!-- Arrow 2 to 3 (In Stock) -->
  <path d="M 375 155 L 420 155" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)" fill="none"/>
  <text x="398" y="145" font-family="DejaVu Sans, Arial" font-size="9" font-weight="bold" fill="#059669" text-anchor="middle">Yes</text>

  <!-- Step 3: Issue & Inventory Lock -->
  <g filter="url(#shadow)">
    <rect x="425" y="100" width="155" height="110" rx="8" fill="url(#emeraldGrad)" stroke="#047857" stroke-width="1"/>
    <text x="502" y="128" font-family="DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Issue &amp; Lock</text>
    <text x="502" y="148" font-family="DejaVu Sans, Arial" font-size="10" fill="#ecfdf5" text-anchor="middle">Atomic Decrement</text>
    <text x="502" y="165" font-family="DejaVu Sans, Arial" font-size="9" fill="#d1fae5" text-anchor="middle">Status: ACTIVE</text>
    <rect x="440" y="178" width="125" height="18" rx="4" fill="#064e3b" opacity="0.4"/>
    <text x="502" y="191" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#ffffff" text-anchor="middle">POST /borrow/issue</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 580 155 L 625 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 4: Temporal Due Date Check (Diamond) -->
  <g filter="url(#shadow)">
    <polygon points="705,100 775,155 705,210 635,155" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="705" y="148" font-family="DejaVu Sans, Arial" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">On Time?</text>
    <text x="705" y="166" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#b45309" text-anchor="middle">t &lt;= due_date</text>
  </g>

  <!-- Branch 4A: On Time Return (Up to Green Box) -->
  <path d="M 705 100 L 705 60 L 795 60" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)" fill="none"/>
  <text x="735" y="52" font-family="DejaVu Sans, Arial" font-size="9" font-weight="bold" fill="#059669">Yes (On-Time)</text>

  <rect x="795" y="35" width="80" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" filter="url(#shadow)"/>
  <text x="835" y="55" font-family="DejaVu Sans, Arial" font-size="9.5" font-weight="bold" fill="#065f46" text-anchor="middle">Closed</text>
  <text x="835" y="72" font-family="DejaVu Sans, Arial" font-size="8" fill="#047857" text-anchor="middle">Zero Fine</text>

  <!-- Branch 4B: Overdue Assessment (Down to Red Box) -->
  <path d="M 705 210 L 705 255" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <text x="715" y="235" font-family="DejaVu Sans, Arial" font-size="9" font-weight="bold" fill="#dc2626">No (Overdue)</text>

  <g filter="url(#shadow)">
    <rect x="625" y="260" width="160" height="95" rx="8" fill="url(#redGrad)" stroke="#b91c1c" stroke-width="1"/>
    <text x="705" y="286" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Fine Assessed</text>
    <text x="705" y="304" font-family="DejaVu Sans, Arial" font-size="9.5" fill="#fee2e2" text-anchor="middle">Delta Days * Rate</text>
    <text x="705" y="322" font-family="DejaVu Sans, Arial" font-size="8.5" fill="#fecaca" text-anchor="middle">FineRecord (isPaid: false)</text>
    <rect x="640" y="330" width="130" height="16" rx="4" fill="#450a0a" opacity="0.4"/>
    <text x="705" y="342" font-family="DejaVu Sans Mono, monospace" font-size="8" fill="#ffffff" text-anchor="middle">POST /borrow/return</text>
  </g>

  <!-- Arrow to Step 5: Payment & Settlement -->
  <path d="M 625 310 L 535 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="400" y="260" width="130" height="95" rx="8" fill="url(#purpleGrad)" stroke="#6d28d9" stroke-width="1"/>
    <text x="465" y="286" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Settlement</text>
    <text x="465" y="304" font-family="DejaVu Sans, Arial" font-size="9.5" fill="#ede9fe" text-anchor="middle">Fine Cleared</text>
    <text x="465" y="322" font-family="DejaVu Sans, Arial" font-size="8.5" fill="#ddd6fe" text-anchor="middle">isPaid: true</text>
    <rect x="410" y="330" width="110" height="16" rx="4" fill="#2e1065" opacity="0.4"/>
    <text x="465" y="342" font-family="DejaVu Sans Mono, monospace" font-size="8" fill="#ffffff" text-anchor="middle">PUT /fines/{id}/pay</text>
  </g>

  <!-- Legend at bottom -->
  <rect x="40" y="375" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="60" y="385" font-family="DejaVu Sans, Arial" font-size="9" fill="#334155">Discovery</text>
  <rect x="130" y="375" width="12" height="12" rx="3" fill="#10b981"/>
  <text x="150" y="385" font-family="DejaVu Sans, Arial" font-size="9" fill="#334155">Active Issue</text>
  <rect x="235" y="375" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="255" y="385" font-family="DejaVu Sans, Arial" font-size="9" fill="#334155">Overdue Assessment</text>
  <rect x="390" y="375" width="12" height="12" rx="3" fill="#8b5cf6"/>
  <text x="410" y="385" font-family="DejaVu Sans, Arial" font-size="9" fill="#334155">Financial Settlement</text>
</svg>
