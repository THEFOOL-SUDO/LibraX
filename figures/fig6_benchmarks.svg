<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="springBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="chartShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <rect x="12" y="12" width="876" height="456" rx="8" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Diagram Title Header -->
  <text x="35" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    Figure 6: Empirical System Benchmarks, Latency Profiling &amp; Concurrency Stress Scaling
  </text>
  <text x="35" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#64748b">
    Stress test comparison across concurrent load (10 to 1,000 patrons): Latency curves, TPS throughput, and error rates.
  </text>

  <!-- PANEL 1: Latency vs Concurrent Patrons (x=35 to 445, y=75 to 265) -->
  <g filter="url(#chartShadow)">
    <rect x="35" y="75" width="405" height="185" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="96" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#1e3a8a">
      A. Latency vs. Concurrent Users (ms)
    </text>

    <!-- Axes -->
    <line x1="80" y1="225" x2="415" y2="225" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="80" y1="115" x2="80" y2="225" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Grid lines -->
    <line x1="80" y1="190" x2="415" y2="190" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="193" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">100</text>
    <line x1="80" y1="155" x2="415" y2="155" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="158" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">250</text>
    <line x1="80" y1="120" x2="415" y2="120" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="123" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">500</text>

    <!-- X-axis Labels -->
    <text x="120" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">50</text>
    <text x="180" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">100</text>
    <text x="240" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">250</text>
    <text x="300" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">500</text>
    <text x="360" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">1000</text>

    <!-- Curve 1: Legacy Node.js (Red, steep spike) -->
    <path d="M 80 215 Q 180 205, 240 185 T 300 150 T 360 125" fill="none" stroke="#ef4444" stroke-width="2.2"/>
    <circle cx="360" cy="125" r="3.5" fill="#ef4444"/>
    <text x="368" y="126" font-family="DejaVu Sans" font-size="7.5" font-weight="bold" fill="#b91c1c">Legacy (480ms)</text>

    <!-- Curve 2: LibraX Write Transactions (Amber) -->
    <path d="M 80 221 Q 180 220, 240 217 T 300 214 T 360 211" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
    <circle cx="360" cy="211" r="3.5" fill="#f59e0b"/>
    <text x="368" y="210" font-family="DejaVu Sans" font-size="7.5" font-weight="bold" fill="#b45309">LibraX Write (48ms)</text>

    <!-- Curve 3: LibraX Read Catalog (Emerald) -->
    <path d="M 80 223 Q 180 223, 240 222 T 300 220 T 360 218" fill="none" stroke="#10b981" stroke-width="2.2"/>
    <circle cx="360" cy="218" r="3.5" fill="#10b981"/>
    <text x="368" y="224" font-family="DejaVu Sans" font-size="7.5" font-weight="bold" fill="#047857">LibraX Read (24ms)</text>
  </g>

  <!-- PANEL 2: Throughput (TPS) Scaling (x=460 to 865, y=75 to 265) -->
  <g filter="url(#chartShadow)">
    <rect x="460" y="75" width="405" height="185" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="473" y="96" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#059669">
      B. Throughput Scaling (Transactions / Sec)
    </text>

    <!-- Axes -->
    <line x1="505" y1="225" x2="840" y2="225" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="505" y1="115" x2="505" y2="225" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Grid lines -->
    <line x1="505" y1="190" x2="840" y2="190" stroke="#f1f5f9" stroke-width="1"/>
    <text x="498" y="193" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">500</text>
    <line x1="505" y1="155" x2="840" y2="155" stroke="#f1f5f9" stroke-width="1"/>
    <text x="498" y="158" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">1,500</text>
    <line x1="505" y1="120" x2="840" y2="120" stroke="#f1f5f9" stroke-width="1"/>
    <text x="498" y="123" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="end">2,500</text>

    <!-- X-axis Labels -->
    <text x="545" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">50</text>
    <text x="605" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">100</text>
    <text x="665" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">250</text>
    <text x="725" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">500</text>
    <text x="785" y="238" font-family="DejaVu Sans" font-size="8" fill="#64748b" text-anchor="middle">1000</text>

    <!-- Curve 1: Spring Boot 3 + HikariCP (Blue, scales up to 2450) -->
    <path d="M 505 220 L 545 208 L 605 186 L 665 152 L 725 130 L 785 122" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <circle cx="785" cy="122" r="3.5" fill="#2563eb"/>
    <text x="710" y="115" font-family="DejaVu Sans" font-size="7.5" font-weight="bold" fill="#1e40af">LibraX (2,450 TPS)</text>

    <!-- Curve 2: Legacy Node.js (Red, flattens early at 320) -->
    <path d="M 505 221 L 545 214 L 605 205 L 665 200 L 725 199 L 785 199" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="785" cy="199" r="3.5" fill="#ef4444"/>
    <text x="710" y="194" font-family="DejaVu Sans" font-size="7.5" font-weight="bold" fill="#b91c1c">Legacy Cap (320 TPS)</text>
  </g>

  <!-- PANEL 3: Comparative Resilience & Health Metrics Bar Cards (y=275 to 445) -->
  <g filter="url(#chartShadow)">
    <rect x="35" y="275" width="830" height="165" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="296" font-family="DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#334155">
      C. Architectural Reliability &amp; Resource Efficiency Matrix
    </text>

    <!-- Metric Card 1: Concurrency Error Rate -->
    <g transform="translate(55, 310)">
      <rect x="0" y="0" width="235" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" fill="#0f172a">Error Rate @ 1,000 Users</text>
      
      <!-- LibraX bar -->
      <text x="12" y="44" font-family="DejaVu Sans" font-size="8" fill="#475569">LibraX (HikariCP):</text>
      <rect x="12" y="50" width="205" height="10" rx="2" fill="#e2e8f0"/>
      <rect x="12" y="50" width="2" height="10" rx="2" fill="#10b981"/>
      <text x="25" y="59" font-family="DejaVu Sans Mono" font-size="8" font-weight="bold" fill="#047857">0.00% (0 errors / 50k)</text>

      <!-- Legacy bar -->
      <text x="12" y="76" font-family="DejaVu Sans" font-size="8" fill="#475569">Legacy Node.js/SQLite:</text>
      <rect x="12" y="82" width="205" height="10" rx="2" fill="#e2e8f0"/>
      <rect x="12" y="82" width="130" height="10" rx="2" fill="#ef4444"/>
      <text x="148" y="91" font-family="DejaVu Sans Mono" font-size="8" font-weight="bold" fill="#b91c1c">8.42% (Locks)</text>
    </g>

    <!-- Metric Card 2: Memory Footprint -->
    <g transform="translate(305, 310)">
      <rect x="0" y="0" width="245" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" fill="#0f172a">JVM Heap vs Node.js RSS</text>
      
      <!-- LibraX G1GC -->
      <text x="12" y="44" font-family="DejaVu Sans" font-size="8" fill="#475569">Spring Boot (G1GC Steady):</text>
      <rect x="12" y="50" width="215" height="10" rx="2" fill="#e2e8f0"/>
      <rect x="12" y="50" width="125" height="10" rx="2" fill="#3b82f6"/>
      <text x="142" y="59" font-family="DejaVu Sans Mono" font-size="8" font-weight="bold" fill="#1e40af">145 MB Heap</text>

      <!-- Legacy RSS -->
      <text x="12" y="76" font-family="DejaVu Sans" font-size="8" fill="#475569">Node.js Single Process RSS:</text>
      <rect x="12" y="82" width="215" height="10" rx="2" fill="#e2e8f0"/>
      <rect x="12" y="82" width="180" height="10" rx="2" fill="#f97316"/>
      <text x="196" y="91" font-family="DejaVu Sans Mono" font-size="8" font-weight="bold" fill="#c2410c">210 MB</text>
    </g>

    <!-- Metric Card 3: Production Build & Asset Delivery -->
    <g transform="translate(565, 310)">
      <rect x="0" y="0" width="285" height="110" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="DejaVu Sans" font-size="9.5" font-weight="bold" fill="#0f172a">Client Rendering &amp; Asset Bundle</text>

      <text x="12" y="44" font-family="DejaVu Sans" font-size="8" fill="#475569">• Three.js Framerate: <tspan font-weight="bold" fill="#047857">60.0 FPS Stable</tspan></text>
      <text x="12" y="60" font-family="DejaVu Sans" font-size="8" fill="#475569">• Vite 5 Rollup Build Time: <tspan font-weight="bold" fill="#1e40af">1.79 seconds</tspan></text>
      <text x="12" y="76" font-family="DejaVu Sans" font-size="8" fill="#475569">• Total Gzip Bundle: <tspan font-weight="bold" fill="#0f172a">241.8 KB</tspan></text>
      <text x="12" y="92" font-family="DejaVu Sans" font-size="8" fill="#475569">• API Test Suite Status: <tspan font-weight="bold" fill="#047857">19/19 Passed (100%)</tspan></text>
    </g>
  </g>
</svg>
